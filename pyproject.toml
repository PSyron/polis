[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "polis-nlp"
version = "0.2.0"
description = "Offline Polish text analysis and minimal correction library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paweł Cyroń" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: Polish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
morphology = ["morfeusz2==1.99.15"]
dev = [
  "build>=1.3.0",
  "hatchling>=1.27.0",
  "morfeusz2==1.99.15",
  "mypy>=2.3.0",
  "packaging>=26.2",
  "pytest>=9.0.0",
  "ruff>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/PSyron/polis"
Repository = "https://github.com/PSyron/polis"

[project.scripts]
polis = "polis.cli:main"

[tool.uv]
required-version = "==0.11.2"

[tool.hatch.build.targets.wheel]
packages = ["src/polis"]
exclude = [
  "/src/polis/evaluation/__main__.py",
  "/src/polis/evaluation/calibration_*.py",
  "/src/polis/evaluation/holdout_*.py",
  "/src/polis/evaluation/rule_family_qualification.py",
  "/src/polis/evaluation/synthetic_corpus.py",
  "/src/polis/evaluation/_synthetic_corpus_*.py",
  "/src/polis/evaluation/datasets/synthetic_v1/**",
]

[tool.hatch.build.targets.wheel.force-include]
"docs/architecture/decisions/0023-evaluation-namespace-1-0.md" = "docs/architecture/decisions/0023-evaluation-namespace-1-0.md"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
exclude = [
  "/src/polis/evaluation/__main__.py",
  "/src/polis/evaluation/calibration_*.py",
  "/src/polis/evaluation/holdout_*.py",
  "/src/polis/evaluation/rule_family_qualification.py",
  "/src/polis/evaluation/synthetic_corpus.py",
  "/src/polis/evaluation/_synthetic_corpus_*.py",
  "/src/polis/evaluation/datasets/synthetic_v1/**",
]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/polis/**",
  "/docs/cli.md",
  "/docs/compatibility.md",
  "/docs/customization.md",
  "/docs/development/dependency-licenses.md",
  "/docs/distribution-verification.md",
  "/docs/limitations.md",
  "/docs/offline-operation.md",
  "/docs/prerelease-candidate.md",
  "/docs/privacy-audit.md",
  "/docs/privacy.md",
  "/docs/public-api.md",
  "/docs/quick-start.md",
  "/docs/release-notes/0.1.0-erratum.md",
  "/docs/release-notes/0.1.0.md",
  "/docs/release-notes/0.2.0.md",
  "/docs/rules.md",
  "/docs/segmentation.md",
  "/docs/architecture/decisions/0001-python-platform-licensing-policy.md",
  "/docs/architecture/decisions/0003-public-api-and-exception-contract.md",
  "/docs/architecture/decisions/0008-hybrid-correction-policy.md",
  "/docs/architecture/decisions/0018-runtime-composition-protocols.md",
  "/docs/architecture/decisions/0019-evaluation-namespace-compatibility.md",
  "/docs/architecture/decisions/0023-evaluation-namespace-1-0.md",
  "/examples/polis.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
  "research: tests that require research corpora, benchmark runners, recorded qualification, or optional research runtimes",
  "slow: tests excluded from per-change CI because they are resource intensive",
]

[tool.ruff]
line-length = 88
src = ["src"]
include = [
  "pyproject.toml",
  "scripts/**/*.py",
  "src/**/*.py",
  "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/bootstrap_github.py" = ["E501"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = ["scripts"]
exclude = ["^tests/typecheck/"]
strict = true
warn_unused_configs = true
follow_imports = "skip"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["scripts.bootstrap_github", "bootstrap_github"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
